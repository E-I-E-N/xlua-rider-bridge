name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: sdk
        with:
          path: .sdk
          key: xlua-sdk-linux-${{ hashFiles('sdk.json') }}
      - name: Download SDKs
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import zipfile
          from pathlib import Path
          sdk = json.loads(Path('sdk.json').read_text())
          root = Path('.sdk')
          root.mkdir(exist_ok=True)
          for prefix, filename in [('rider_linux', 'rider.tar.gz'), ('lua', 'lua.zip')]:
              archive = root / filename
              subprocess.run(['curl', '--fail', '--location', '--retry', '3', sdk[prefix + '_url'], '--output', str(archive)], check=True)
              with archive.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != sdk[prefix + '_sha256']:
                  raise SystemExit('SDK checksum mismatch: ' + filename)
              if prefix == 'rider_linux':
                  target = root / 'rider'
                  target.mkdir(exist_ok=True)
                  subprocess.run(['tar', '-xzf', str(archive), '--strip-components=1', '-C', str(target)], check=True)
              else:
                  with zipfile.ZipFile(archive) as source:
                      source.extractall(root)
              archive.unlink()
          PY
      - name: Build plugin
        env:
          RIDER_HOME: .sdk/rider
          LUA_PLUGIN_PATH: .sdk/lua
        run: python -B build.py
      - uses: actions/upload-artifact@v4
        with:
          name: xlua-rider-bridge
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xlua-rider-bridge
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag --title "XLua CSharp Navigation $RELEASE_TAG" --generate-notes
